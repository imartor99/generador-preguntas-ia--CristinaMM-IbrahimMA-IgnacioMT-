<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Preguntas IA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script type="module" src="main.js"></script>

    <div id="app">

        <h1>Generador de Preguntas</h1>

        <div>
            <label for="selectorTemas">Selecciona un tema:</label>
            <select id="selectorTemas" name="opciones">
                <option value="" disabled selected>Selecciona un tema</option>
                <option value="javascript">JavaScript</option>
                <option value="seguridad_web">Seguridad Web (OWASP)</option>
                <option value="historia_ia">Historia de la IA</option>
            </select>
        </div>
        <br>




        <div>
            <label for="numPreguntas">Número de preguntas (1-5):</label>
            <input type="number" id="numPreguntas" min="1" max="5" value="3">
        </div>
        <br>




        <div>
            <button id="btnGenerar">Generar Preguntas</button>
            <button id="btnLimpiar">Limpiar</button>
        </div>
        <br>


        <!-- Indicador de carga (texto "Generando...", intentaré cambiarlo por un spinner) -->
        <div id="loadingIndicator" style="display: none;">
            Generando...
        </div>




        <div id="contenedorPreguntas">
            <p>Las preguntas aparecerán aquí.</p>
        </div>






    </div>
</body>

</html>
